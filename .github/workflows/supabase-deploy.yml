name: Deploy portal backend
# Applies supabase/schema.sql as a migration and deploys the edge functions. Needs repo secrets:
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, RESEND_API_KEY, NOTIFY_TO
on:
  workflow_dispatch:
  push:
    paths: ["supabase/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Build migration files
        run: |
          mkdir -p supabase/migrations
          sed "s/__REF__/$REF/g" supabase/schema.sql > supabase/migrations/20260917000000_portal.sql
          printf "insert into public.admin_emails(email) values ('%s') on conflict do nothing;\n" "${{ secrets.NOTIFY_TO }}" > supabase/migrations/20260917000001_admin.sql
      - run: supabase link --project-ref "$REF"
      - run: supabase db push --include-all
      - run: supabase secrets set RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" NOTIFY_TO="${{ secrets.NOTIFY_TO }}" PORTAL_URL="https://craftmaster7.github.io/cardworx/portal.html"
      - run: supabase functions deploy notify-submission
      - run: supabase functions deploy invite-agent
