name: Deploy portal backend
# Applies supabase/schema.sql as a migration and deploys the edge functions. Needs repo secrets:
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, RESEND_API_KEY, NOTIFY_TO
on:
  workflow_dispatch:
  push:
    paths: ["supabase/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      RAW_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: "2.117.0" }
      - name: Normalize project ref
        run: |
          R="$RAW_REF"; R="${R#https://}"; R="${R#http://}"; R="${R%%.*}"; R="${R%%/*}"; R="$(echo "$R" | tr -d '[:space:]')"
          echo "REF=$R" >> "$GITHUB_ENV"; echo "Project ref length: ${#R}"
      - name: Build migration files
        run: |
          mkdir -p supabase/migrations
          python3 - <<'PY'
          import os
          ref=os.environ['REF']; email=os.environ['NOTIFY_TO'].strip()
          open('supabase/migrations/20260917000000_portal.sql','w').write(open('supabase/schema.sql').read().replace('__REF__',ref))
          open('supabase/migrations/20260917000001_admin.sql','w').write("insert into public.admin_emails(email) values ('%s') on conflict do nothing;\n"%email.replace("'","''"))
          PY
        env: { NOTIFY_TO: "${{ secrets.NOTIFY_TO }}" }
      - name: Check access token can see the project
        run: |
          code=$(curl -s -o /tmp/p.json -w "%{http_code}" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF")
          echo "HTTP $code"; [ "$code" = "200" ] || { echo "Token cannot read project $REF"; cat /tmp/p.json; exit 1; }
      - name: Check database password
        run: |
          host=$(python3 -c "import json;print(json.load(open('/tmp/p.json')).get('region',''))")
          echo "region: $host"
          sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "postgresql://postgres.$REF@aws-0-$host.pooler.supabase.com:5432/postgres?sslmode=require" -c "select 1" >/dev/null && echo "password ok"
          echo "DBURL=postgresql://postgres.$REF:$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''))")@aws-0-$host.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"
      - name: Push database schema
        run: |
          set -o pipefail
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$DBURL" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee -a /tmp/db.log || { echo "::error title=Schema push failed::$(grep -i error /tmp/db.log | tail -3 | tr '\n' ' ')"; exit 1; }
          done
      - name: Set function secrets
        run: |
          python3 -c "import json,os;json.dump([{'name':'RESEND_API_KEY','value':os.environ['R'].strip()},{'name':'NOTIFY_TO','value':os.environ['N'].strip()},{'name':'PORTAL_URL','value':'https://craftmaster7.github.io/cardworx/portal.html'}],open('/tmp/body.json','w'))"
          echo "payload bytes: $(wc -c < /tmp/body.json)"
          code=$(curl -s -o /tmp/s.log -w "%{http_code}" -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/body.json "https://api.supabase.com/v1/projects/$REF/secrets")
          echo "HTTP $code"; case "$code" in 2*) ;; *) echo "::error title=Set function secrets failed::HTTP $code $(tr -d '\n' < /tmp/s.log | cut -c1-500)"; exit 1;; esac
        env: { R: "${{ secrets.RESEND_API_KEY }}", N: "${{ secrets.NOTIFY_TO }}" }
      - name: Deploy edge functions
        run: |
          for fn in notify-submission invite-agent; do
            meta=$(python3 -c "import json;print(json.dumps({'name':'$fn','entrypoint_path':'index.ts','verify_jwt':False}))")
            code=$(curl -s -o /tmp/s.log -w "%{http_code}" -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -F "metadata=$meta;type=application/json" -F "file=@supabase/functions/$fn/index.ts;filename=index.ts;type=application/typescript" "https://api.supabase.com/v1/projects/$REF/functions/deploy?slug=$fn")
            echo "$fn HTTP $code"; case "$code" in 2*) ;; *) echo "::error title=Deploy $fn failed::HTTP $code $(tr -d '\n' < /tmp/s.log | cut -c1-500)"; exit 1;; esac
          done
